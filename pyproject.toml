[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cool-s"
version = "1.0.0"
description = "Draw the legendary Cool S in your terminal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
keywords = ["terminal", "toy", "cool-s", "graffiti", "ascii", "animation", "cli", "fun"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Games/Entertainment",
    "Topic :: Terminals",
]

[project.urls]
Homepage = "https://github.com/fourzerosix/cool-s"
"Bug Tracker" = "https://github.com/fourzerosix/cool-s/issues"
Wikipedia = "https://en.wikipedia.org/wiki/Cool_S"

[project.scripts]
cool-s = "cool_s:main"

[tool.setuptools.packages.find]
include = ["cool_s*"]

[tool.setuptools.package-data]
cool_s = ["*.c"]
