name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── CI (build + test on every tag) ─────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Smoke test
        run: make check

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Smoke test
        run: make check

  # ── PyPI publish ────────────────────────────────────────────────────────────
  pypi:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # needed for trusted publishing (no API key required)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses PyPI Trusted Publishing -- no PYPI_API_TOKEN secret needed.
        # Set up at: https://pypi.org/manage/account/publishing/

  # ── Docker publish ──────────────────────────────────────────────────────────
  docker:
    needs: [build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: meta
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.fourzerosix }}/cool-s:latest
            ${{ secrets.fourzerosix }}/cool-s:${{ steps.meta.outputs.VERSION }}

  # ── GitHub Release (with tarball) ──────────────────────────────────────────
  github-release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build release tarball
        run: make && make dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: cool-s-*.tar.gz
          generate_release_notes: true
